[package]
name = "psst"
version = "0.1.0"
edition = "2021"
description = "psst — pi session tui: browse, inspect, and resume pi coding-agent sessions"
license = "MIT"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
toml = "0.8"

[profile.release]
opt-level = 2